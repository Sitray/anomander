name: CI

# Paused: GitHub Actions minutes are not available on the current plan. The same checks run
# locally before every merge to main with `scripts/ci-local.sh`; it can still be started by hand
# from the Actions tab. Restore `pull_request` and `push: branches: [main]` once
# Actions is available again.
on:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its version in a comment; Dependabot
# (.github/dependabot.yml) proposes the updates.

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and tests for the TypeScript workspace and the desktop shell (Rust).
  # One job, because the Rust tests run the real daemon scripts with `node` and the installed
  # workspace (`ledger_import.rs`, `oauth_connect.rs`), so they come after `pnpm install`.
  # On macOS and on Windows: the shell builds from source on both.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # The files keep their LF endings on Windows, as Biome and the tests expect.
      - name: git config core.autocrlf false
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm -r typecheck
      - run: pnpm test

      # The `stable` branch of this action has no tags; its master commit takes the toolchain
      # as an input instead.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # The TypeScript checks on Linux, the system the Docker image runs on. The Rust shell is
  # macOS and Windows only, so it is not built here.
  check-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm -r typecheck
      - run: pnpm test

  # The shell still compiles on the oldest compiler it declares: `rust-version` in Cargo.toml,
  # read from there so the two never drift. rust-toolchain.toml selects stable, so the check names
  # the toolchain explicitly. macOS, where the shell needs no system libraries.
  msrv:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: cargo check on rust-version
        working-directory: apps/desktop/src-tauri
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets

  # Smoke build of the Mac app: a debug, unsigned `.app` (no signing identity is configured),
  # so it proves the frontend build and the bundled shell compile, not that the app is
  # distributable.
  tauri-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: tauri build (debug, unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build --debug --ci

  # Smoke build of the Windows app: a debug, unsigned NSIS installer, not uploaded. Like the Mac
  # job, it proves the frontend build and the bundled shell compile, with the Windows icon, not
  # that the installer is distributable.
  tauri-build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: tauri build (debug, unsigned NSIS installer)
        working-directory: apps/desktop
        run: pnpm tauri build --debug --ci --bundles nsis

  # The daemon's container image (Dockerfile, used by compose.yaml) still builds and starts.
  # Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag anomander-daemon:ci .
      # Starts the image with no model and no Telegram: a throwaway ANOMANDER_LOCAL_TOKEN is the
      # only front door, so the daemon runs its setup guide and holds its database lock, which is
      # what the image's HEALTHCHECK reads. No port is published and no secret is used. The same
      # steps run in scripts/ci-local.sh.
      - name: docker smoke start (healthy)
        run: |
          check="$(docker image inspect --format '{{with .Config.Healthcheck}}{{index .Test 0}}{{end}}' anomander-daemon:ci)"
          if [[ -z "$check" || "$check" == NONE ]]; then
            echo "anomander-daemon:ci has no HEALTHCHECK (Dockerfile), so it can never turn healthy" >&2
            exit 1
          fi
          token="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          # The logs, on every way out once the container may exist.
          trap 'docker logs anomander-smoke 2>&1 || true; docker rm --force anomander-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name anomander-smoke --health-interval=2s \
            --env ANOMANDER_LOCAL_TOKEN="$token" anomander-daemon:ci
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Running}}{{with .State.Health}}{{.Status}}{{else}}without health{{end}}{{else}}exited{{end}}' anomander-smoke)"
            [[ "$status" == starting ]] || break
            sleep 2
          done
          echo "container status: $status"
          [[ "$status" == healthy ]]

  # Known vulnerabilities in the locked dependencies: high or critical in the pnpm workspace, any
  # in the Rust shell (RustSec). `scripts/ci-local.sh` runs the pnpm audit, and the cargo audit
  # only where cargo-audit is already installed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level high
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
