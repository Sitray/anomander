name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and tests for the TypeScript workspace and the desktop shell (Rust).
  # One job, because the Rust tests run the real daemon scripts with `node` and the installed
  # workspace (`ledger_import.rs`, `oauth_connect.rs`), so they come after `pnpm install`.
  check:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm -r typecheck
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # Smoke build of the Mac app: a debug, unsigned `.app` (no signing identity is configured),
  # so it proves the frontend build and the bundled shell compile, not that the app is
  # distributable.
  tauri-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: tauri build (debug, unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build --debug --ci

  # The daemon's container image (Dockerfile, used by compose.yaml) still builds. Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag anomander-daemon:ci .
