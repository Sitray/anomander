[package]
name = "anomander-desktop"
version = "0.1.0"
description = "ANOMANDER desktop shell: starts and supervises the daemon, the Keychain and the menu bar (M6)."
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "anomander_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: `mcp.json` is rewritten with its servers in the order the principal wrote.
serde_json = { version = "1", features = ["preserve_order"] }
# DK-3 AC2: the launch token comes from the operating system's CSPRNG.
tauri-plugin-notification = "2"
# "Copiar diagnóstico" in the menu bar menu: the report goes to the clipboard (Rust only).
tauri-plugin-clipboard-manager = "=2.3.3"
getrandom = "0.3"
# T1b: the careful words compare as the daemon's do (NFKD, without marks). Both were already in
# the build, through `url`.
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
# DK-1 AC1: SIGTERM first, so the daemon can stop cleanly before a SIGKILL.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# DK-5: secrets live in the macOS Keychain.
security-framework = "3"

[target.'cfg(windows)'.dependencies]
# DK-5: secrets live in the Credential Manager. Only its Windows store, no other platform's.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# The daemon's `TZ`: Windows names its zones its own way; this maps them to IANA names.
iana-time-zone = "=0.1.65"
# The log's capture of stdout and stderr, the OS version of the diagnostics, opening a URL.
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# `tests/capabilities.rs`: the mock runtime checks the windows' command permissions.
tauri = { version = "2.12", features = ["tray-icon", "test"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
