[package]
name = "anomander-desktop"
version = "0.0.0"
description = "ANOMANDER desktop shell: starts and supervises the daemon, the Keychain and the menu bar (M6)."
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "anomander_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: `mcp.json` is rewritten with its servers in the order the principal wrote.
serde_json = { version = "1", features = ["preserve_order"] }
# DK-3 AC2: the launch token comes from the operating system's CSPRNG.
tauri-plugin-notification = "2"
getrandom = "0.3"
# DK-1 AC1: SIGTERM first, so the daemon can stop cleanly before a SIGKILL.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# DK-5: secrets live in the macOS Keychain.
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
